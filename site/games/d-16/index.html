<!doctype html>
<html lang="ja"><head>
<meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#172737"><title>ロケットがとんでいく</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#192939;touch-action:none;user-select:none;-webkit-user-select:none}#world{display:block;width:100%;height:100%;position:absolute;inset:0}.overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
:root{--edge:clamp(16px,2.7vw,43px)}.route,.sound{position:absolute;top:max(var(--edge),env(safe-area-inset-top));color:#e1e7e8;border:1px solid #d5e7f239;background:linear-gradient(135deg,#344450b8,#142431c9);box-shadow:inset 0 1px 0 #f3faff12,0 4px 18px #06122026;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.route{left:max(var(--edge),env(safe-area-inset-left));border-radius:16px;height:54px;display:flex;align-items:center;padding:5px 9px;gap:3px}.chapter{position:relative;width:38px;height:38px;display:grid;place-items:center;color:#ced8dd80;border-radius:10px;transition:color 1s,background 1s,box-shadow 1s}.chapter.active{color:#ffe0a9;background:linear-gradient(155deg,#eab27134,#dab37c13);box-shadow:inset 0 0 0 1px #eecb913d}.chapter.done{color:#e4dbc6}.chapter svg{width:25px;height:25px}.trail{width:14px;height:2px;display:block;background:radial-gradient(circle,#d9dcde70 1px,transparent 1.1px) 0 0/5px 2px}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.sound{right:max(var(--edge),env(safe-area-inset-right));width:47px;height:47px;border-radius:50%;display:grid;place-items:center;padding:10px;cursor:pointer;pointer-events:auto}.sound svg{width:25px;height:25px}.sound .muted{display:none}.sound.off .muted{display:block}.sound.off .audible{display:none}
#telemetry{position:absolute;left:max(var(--edge),env(safe-area-inset-left));bottom:max(var(--edge),env(safe-area-inset-bottom));width:144px;height:65px}
#control{position:absolute;pointer-events:auto;background:none;border:0;padding:0;cursor:grab;touch-action:none;border-radius:19%;transform:rotate(-4deg);outline-offset:3px}#control:active{cursor:grabbing}#control:disabled{cursor:default}
#finger{position:absolute;width:35px;height:46px;opacity:0;filter:drop-shadow(0 2px 3px #101c2b99);color:white;transform-origin:20% 12%}#finger svg{width:100%;height:100%;fill:#f8fbf9c4;stroke:#283646;stroke-width:1.1}
#shutter{position:absolute;inset:0;background:#182635;opacity:0;pointer-events:none}
@media(max-width:550px){.route{height:45px;border-radius:13px;gap:1px;padding:4px 6px}.chapter{width:31px;height:32px;border-radius:8px}.chapter svg{width:21px;height:21px}.trail{width:11px}.sound{width:42px;height:42px;padding:8px}#telemetry{width:105px;height:49px}}
</style></head><body>
<canvas id="world" aria-label="海辺の発射場と白いロケット"></canvas>
<div class="overlay">
<div class="route" role="img" aria-label="打ち上げ、宇宙、衛星"><span class="chapter active"><svg viewBox="0 0 28 28"><g transform="rotate(36 14 14)"><path d="M14 2.5C10 6 9.6 12 10.8 18h6.4C18.4 12 18 6 14 2.5Z" fill="currentColor" stroke-width=".8"/><circle cx="14" cy="10.6" r="1.75" fill="#5c5b53" stroke="none"/><path d="m10 13-3.2 4.2-.5 3.6 4.7-2.4m7-5.4 3.2 4.2.5 3.6-4.7-2.4M12.5 21l1.5 4 1.5-4"/></g></svg></span><i class="trail"></i><span class="chapter"><svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="7.7"/><path d="M6.5 13.4c-3.1 2.4-4.5 4.5-3.6 5.7 1.5 2.1 8.1.8 14.6-2.9s10.6-8.2 9.1-10.2c-.9-1.2-3.1-1-6.2.1" transform="translate(-.7 1)"/></svg></span><i class="trail"></i><span class="chapter"><svg viewBox="0 0 28 28"><g transform="rotate(-35 14 14)"><rect x="10.4" y="9.4" width="7.2" height="9.2" rx="1.2"/><path d="M8 14h2.4m7.2 0H20M3 10.5h5v7H3zm17 0h5v7h-5zM12 6.7q3 2.6 5-1.2m-2.9 3.6-.2-1.3"/></g></svg></span></div>
<button class="sound" id="sound" aria-label="音の切り替え" aria-pressed="true"><svg viewBox="0 0 26 26"><path d="M4 10h4l4.6-4v14L8 16H4z" fill="currentColor" stroke-width="1.1"/><g class="audible"><path d="M16 9.3c1.9 2 1.9 5.4 0 7.4m3-10c3.6 3.4 3.6 9.2 0 12.6"/></g><path class="muted" d="m16.5 10 5.5 6m0-6-5.5 6"/></svg></button>
<canvas id="telemetry" aria-label="推力と燃料の計器"></canvas><button id="control" aria-label="赤いレバーを押す"></button>
<div id="finger"><svg viewBox="0 0 35 46"><path d="M8 24 5 8c-.8-4 4.7-5.1 5.7-1.3l3 12.2c.2-4 4.2-4.7 5.7-1.2.7-3.1 4.4-3.3 5.6.2 2.4-2.3 5.5-.8 5.7 2.4l.9 9.2c.3 5.4-2.6 9-5.4 12.4l-12.6 1-9.1-11.2-3.1-7c-1.4-3.1 2.7-5.2 4.7-2.7l3 3.4Z"/></svg></div>
<div id="shutter"></div></div>
<script src="vendor/three.min.js"></script><script src="physics.js"></script><script src="geometry.js"></script><script src="site.js"></script><script src="atmosphere.js"></script><script src="console.js"></script><script src="game.js"></script></body></html>
