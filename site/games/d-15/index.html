<!doctype html>
<html lang="ja"><head>
<meta name="robots" content="noindex,nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#86b8d0"><title>ヘリコプターでお届け</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,main{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#9fc8d5}main{position:relative;touch-action:none;isolation:isolate;user-select:none;-webkit-user-select:none}#view{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}#hud{position:absolute;inset:0;pointer-events:none}
#manifest,#sound{background:linear-gradient(155deg,#fffbeaec,#f2eed7ed);border:1px solid #fff9e2;box-shadow:0 3px 0 #55635655,0 6px 17px #233f3b29,inset 0 0 0 3px #f9f6dfbb}
#manifest{position:absolute;left:max(24px,env(safe-area-inset-left));top:max(22px,env(safe-area-inset-top));width:164px;height:51px;border-radius:27px;display:flex;align-items:center;justify-content:center}#manifest canvas{width:153px;height:44px}
#sound{position:absolute;right:max(24px,env(safe-area-inset-right));top:max(22px,env(safe-area-inset-top));border-radius:50%;width:49px;height:49px;display:grid;place-items:center;padding:0;pointer-events:auto;cursor:pointer}#sound canvas{width:28px;height:28px}#sound:active{transform:translateY(2px)}
#finger{position:absolute;width:54px;height:67px;transform-origin:18% 12%;filter:drop-shadow(0 2px 3px #3b352d59);opacity:0}
#veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(at 28% 12%,#fff7d4,#d6ebdf 72%,#b9dbdb);opacity:0}
@media(max-width:600px){#manifest{left:14px;top:max(15px,env(safe-area-inset-top));transform:scale(.86);transform-origin:top left}#sound{right:15px;top:max(15px,env(safe-area-inset-top));width:43px;height:43px}}
</style></head><body><main><canvas id="view" aria-label="ヘリコプターで木箱を山小屋に届ける"></canvas><div id="hud"><div id="manifest" role="img" aria-label="届けた荷物"><canvas width="459" height="132"></canvas></div><button id="sound" aria-label="音の切り替え" aria-pressed="true"><canvas width="84" height="84"></canvas></button><canvas id="finger" width="162" height="201"></canvas></div><div id="veil"></div></main>
<script src="vendor/three.min.js"></script><script src="flight.js"></script><script src="world.js"></script><script src="models.js"></script><script src="game.js"></script></body></html>
