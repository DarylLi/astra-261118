<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#a6b8a9">
<title>じしゃくでネジあつめ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#c8c9b2;overscroll-behavior:none}
main{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{width:100%;height:100%;display:block;touch-action:none}
#status,#audio{position:absolute;top:max(21px,env(safe-area-inset-top));background:linear-gradient(155deg,#fffae9,#e9dfc8);border:1px solid #fbf7e7;box-shadow:0 2px 1px #817b6699,0 4px 12px #363a322f,inset 0 -2px 2px #c4b69a80;color:#555d53}
#status{left:max(22px,env(safe-area-inset-left));height:40px;border-radius:24px;display:flex;align-items:center;gap:8px;padding:0 14px 0 9px;pointer-events:none}
#status svg{width:25px;height:25px;margin-right:2px}
.lamp{width:9px;height:9px;border-radius:50%;background:#bdbaa8;box-shadow:inset 0 1.4px 2px #555c4d65,0 1px #fff9e2}
.lamp.on{background:#e6a74a;box-shadow:inset 0 1px 2px #fff2be,0 0 5px #f2bc664c}
#audio{right:max(22px,env(safe-area-inset-right));height:42px;width:42px;border-radius:50%;padding:10px;cursor:pointer}
#audio:active{transform:translateY(1px)}
#audio svg{display:block;width:100%;height:100%}
#audio .quiet,#audio.muted .waves{display:none}#audio.muted .quiet{display:block}
@media(max-width:550px){#status{left:15px;gap:7px;height:36px}#audio{right:15px}}
</style>
</head>
<body><main aria-label="じしゃくでネジあつめ">
<canvas id="workbench" aria-label="つりさげた磁石を指で動かし、部品を缶に集めよう"></canvas>
<div id="status" aria-hidden="true"><svg viewBox="0 0 32 32"><g transform="rotate(-32 16 16)"><path d="M7 24V14a9 9 0 0 1 18 0v10" fill="none" stroke="#a65546" stroke-width="6"/><path d="M7 23v4m18-4v4" stroke="#8e9e99" stroke-width="6"/></g></svg><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i></div>
<button id="audio" aria-label="音の切り替え" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor" stroke-width="1.1"/><g class="waves"><path d="M15 8.6q3.5 3.4 0 6.8M18 5.5q6.7 6.5 0 13"/></g><path class="quiet" d="m16 9 5 6m0-6-5 6"/></svg></button>
</main>
<script src="vendor/three.min.js"></script>
<script src="physics.js"></script>
<script src="workshop.js"></script>
<script src="game.js"></script>
</body></html>
