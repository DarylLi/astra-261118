<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#9bbac0">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>波で荷物をあつめる港</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body,main{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
    body{background:#93b2b3;color:#fbf6e6;user-select:none;-webkit-user-select:none}
    main{position:relative;height:100dvh}
    canvas{width:100%;height:100%;display:block;touch-action:none;outline:none}
    button{position:absolute;right:max(21px,env(safe-area-inset-right));bottom:max(21px,env(safe-area-inset-bottom));width:45px;height:45px;border:1px solid rgba(255,250,230,.64);border-radius:50%;background:rgba(33,65,65,.45);box-shadow:0 2px 9px #17363924,inset 0 0 0 3px #e6eee30c;backdrop-filter:blur(7px);color:inherit;display:grid;place-items:center;padding:0;cursor:pointer;touch-action:manipulation}
    button:focus-visible{outline:2px solid ivory;outline-offset:4px}
    button:active{background:rgba(37,74,71,.68)}
    button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
    .off,button[aria-pressed="false"] .on{display:none}
    button[aria-pressed="false"] .off{display:block}
  </style>
</head>
<body>
<main>
  <canvas id="harbor" aria-label="波で荷物をカゴに集める漁港"></canvas>
  <button type="button" id="sound" aria-label="音" aria-pressed="true">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9h4l4-3.5v13L8 15H4z" fill="currentColor" stroke-width="1.1"/>
      <g class="on"><path d="M15 8.3a5.3 5.3 0 0 1 0 7.4M17.8 5.6a9 9 0 0 1 0 12.8"/></g>
      <path class="off" d="m16 9 5 6m0-6-5 6"/>
    </svg>
  </button>
</main>
<script src="vendor/three.min.js"></script>
<script src="simulation.js"></script>
<script src="models.js"></script>
<script src="water.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
