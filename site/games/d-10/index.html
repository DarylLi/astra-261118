<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#c4d9cc">
<title>ボールでたおす塔</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#c7d9cc}body{touch-action:none;user-select:none;-webkit-user-select:none}#garden{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}#controls{position:fixed;inset:0;pointer-events:none;display:flex;align-items:flex-start;justify-content:space-between;padding:max(22px,env(safe-area-inset-top)) max(25px,env(safe-area-inset-right)) 0 max(25px,env(safe-area-inset-left))}
#journey,#sound{height:45px;border:1px solid #fff9;box-shadow:0 3px 12px #414d4221,inset 0 -2px 1px #82765315;background:rgba(255,251,231,.89);border-radius:28px;backdrop-filter:blur(8px)}
#journey{display:flex;align-items:center;gap:7px;padding:0 13px}#journey i{display:block;width:22px;height:22px;position:relative;color:#bcac89;opacity:.59}#journey i:before{content:'';position:absolute;top:2px;left:3px;width:16px;height:8px;background:currentColor;clip-path:polygon(50% 0,100% 100%,0 100%)}#journey i:after{content:'';position:absolute;left:5px;top:11px;width:12px;height:9px;background:radial-gradient(ellipse 3px 5px at 50% 100%,transparent 92%,currentColor 100%);border-radius:1px}#journey i.current{color:#cb6046;opacity:1}#journey i.done{color:#71947a;opacity:1}
#sound{cursor:pointer;pointer-events:auto;width:45px;padding:0;display:grid;place-items:center}#sound canvas{width:25px;height:25px}#sound:focus-visible{outline:3px solid #b38337;outline-offset:3px}
@media(max-width:600px){#controls{padding:max(16px,env(safe-area-inset-top)) 16px 0}#sound,#journey{height:40px}#sound{width:40px}#journey{gap:4px;padding:0 10px}}
</style>
</head>
<body>
<canvas id="garden" aria-label="芝生の庭と、ボールを引いて遊ぶ木の遊具"></canvas>
<div id="controls"><div id="journey" aria-label="塔の進みぐあい"><i class="current"></i><i></i><i></i></div><button id="sound" type="button" aria-label="音を切り替える" aria-pressed="true"><canvas width="64" height="64"></canvas></button></div>
<script src="vendor/three.min.js"></script>
<script src="simulation.js"></script>
<script src="garden.js"></script>
</body>
</html>
