<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#bfd6ce">
<title>おふろがあふれる</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#bfd6ce;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}#bath{display:block;width:100%;height:100%;outline:0}
#sound{position:fixed;top:max(22px,env(safe-area-inset-top));right:max(22px,env(safe-area-inset-right));width:46px;height:46px;border-radius:50%;border:1px solid #ffffffa6;background:#f9faf1ad;box-shadow:0 3px 10px #516c6315,inset 0 1px 0 #fff8;color:#55756f;display:grid;place-items:center;padding:0;cursor:pointer;touch-action:manipulation}
#sound svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.6}#sound .off,#sound[aria-pressed="false"] .on{display:none}#sound[aria-pressed="false"] .off{display:block}
</style>
</head>
<body>
<canvas id="bath" aria-label="おふろがあふれる"></canvas>
<button id="sound" type="button" aria-label="音" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="on" d="M16 8.5c2.2 1.8 2.2 5.2 0 7M18.5 5.5c4 3.6 4 9.4 0 13"/><path class="off" d="m17 10 4 4m0-4-4 4"/></svg></button>
<script src="vendor/three.min.js"></script><script src="sim.js"></script><script src="studio.js"></script><script src="room.js"></script><script src="game.js"></script>
