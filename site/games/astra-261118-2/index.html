function crackle(count,offset){for(let j=0;j<min(7,count+1);j++){const f=clamp(2200+offset*660-count*130+j*140,750,4200);sizzle(.13,.068+j*.006,f,j*.052);note(f*.32,j*.052,.071,.031)}}
function chime(i){const f=[658,392,493][i];note(f,0,.31,.14);note(f*1.5,.07,.38,.067)}
const particleCap=()=>Math.floor(24+48*quality);
function burst(x,y,z,n,kind,strength=1){

function waterAt(x,z,amount){

 for(const g of contents){let near=exp(-.23*dist(g,p));g.wet=clamp(g.wet+amount*(.30+near));g.growth=clamp(g.growth+amount*(.20+.22*near))}

function vent(amount){if(amount<.015||!watered)return;const n=Math.ceil(amount*(9+11*water)),wide=amount>.37;
 for(let j=0;j<n;j++){let x=rand(-2.6,2.6),z=wide?rand(-1.0,1.2):1.75;burst(x,.82+lidOpen*.18,z,1,'steam',wide?1.35:.49);

function setLid(v,sound=true){const old=lidGoal;lidGoal=clamp(v);covered=lidGoal<.60;if(lidGoal>old+.012&&watered){opened=true;if(sound)vent(lidGoal-old)}

function beginWipe(p){
 if(held)returnHeld();
 if(!cleaning){cleaning=true;cleanStart=clock;cleanMarks=0;lidGoal=1;covered=false;
 for(const a of glints.filter((_,i)=>i%8===0))spots.push({x:a.x,z:a.z,r:.29,dirty:.65})}

}
function wipeAt(p,dt){
 if(!cleaning)return;let reach=.94;wipePoint=legalSpot(p.x,p.z);brushFilm(wipePoint.x,wipePoint.z,.95,true);let amount=0;
 for(const s of spots){let influence=clamp(1-dist(wipePoint,s)/reach);if(influence){let old=s.dirty;s.dirty=max(0,s.dirty-influence*max(.32,dt*4.7));amount+=old-s.dirty}}

}
function finishBatch(){
 if(!traySlots.some(s=>s.present))freshTray();
 watered=opened=false;covered=false;lidGoal=1;water*=.15;fog*=.35;order=(order+1)%tapPattern.length;

function update(dt){
 clock+=dt;
 const t=1-exp(-dt*9);lidOpen=mix(lidOpen,lidGoal,t);
 const driving=drag&&drag.kind==='jug'?drag:assist;
 if(driving){
 let goal=driving.target||{x:-2.48,z:.40};driving.pos.x=mix(driving.pos.x,goal.x,1-exp(-dt*12));driving.pos.z=mix(driving.pos.z,goal.z,1-exp(-dt*12));

 for(const g of contents){g.heat=mix(g.heat,1,1-exp(-dt*(.080+.095*water)));g.wet=mix(g.wet,clamp(water),1-exp(-dt*(covered? .26:.043)));g.growth=mix(g.growth,1,1-exp(-dt*(.26+.27*g.wet)))}

 for(const p of plates){if(drag&&drag.kind==='plate'&&drag.plate===p)continue;const tgt=plateTarget(p),f=1-exp(-dt*plateSpeed[p.i]/p.delay);

function circleHit(x,y,cx,cy,cz,rx,rz,minPx=23){
 const p=project(cx,cy,cz),w=max(minPx,rx*W/(2*halfW)),h=max(minPx,rz*tilt*W/(2*halfW));return ((x-p.x)/w)**2+((y-p.y)/h)**2<=1}
function nearestFood(p,limit){let best=null,score=limit;for(const g of contents){const d=Math.hypot(g.x-p.x,(g.z-p.z)*1.15);if(d<score){best=g;score=d}}return best}
function plateHit(x,y,more=0){const p=plates[2];if(secondAmount>.4&&circleHit(x,y,p.x+1.52*secondAmount,dishHeight(p)+.16,p.z-.69,plateSize[2]*.86+more,plateSize[2]*.86+more))return p;return plates.filter(p=>circleHit(x,y,p.x,dishHeight(p)+.22,p.z,plateSize[p.i]+more,plateSize[p.i]+more)).sort((a,b)=>dist(a,plane(x,y,.32))-dist(b,plane(x,y,.32)))[0]}
function hit(x,y){
 if(cleaning)return circleHit(x,y,wipePoint.x,.86,wipePoint.z,.98,.83)?{kind:'cloth'}:{kind:'none'};

 const lp=pos(lidTransform(),[0,.86,0]);if(circleHit(x,y,lp[0],lp[1],lp[2],.67,.66,27))return {kind:'lid'};

 let slots=traySlots.filter(s=>s.present).map(s=>{const q=stockPos(s),uv=project(q.x,.53,q.z);return {s,q,dd:Math.hypot(x-uv.x,(y-uv.y)*1.26)}}).sort((a,b)=>a.dd-b.dd);
 for(const {s,q} of slots)if(circleHit(x,y,q.x,.54,q.z,.83,.66))return {kind:'raw',s};
 const jm=jugTransform();for(const q of [[0,.7,0],[.82,.82,0],[-.49,1.38,0]]){const a=pos(jm,q);if(circleHit(x,y,a[0],a[1],a[2],.66,.71))return {kind:'jug'}}
 if(!held){const tm=turnTransform();for(let i=-1;i<=4;i++){const a=pos(tm,[0,.12,i*.48]);if(circleHit(x,y,a[0],a[1],a[2],.60,.53))return {kind:'spatula'}}}
 if(p&&!turnerArmed)return {kind:'plate',plate:p};
 const q=plane(x,y,surface+.24),food=nearestFood(q,max(.85,halfW*46/W));

 if(p)return {kind:'plate',plate:p};
 // The parked rim can be grasped anywhere along its projected outline.
 const lm=lidTransform();for(let j=0;j<48;j++){const [lx,lz]=outline(3.55,2.10,.65,j/48),a=pos(lm,[lx,.03,lz]);if(circleHit(x,y,a[0],a[1],a[2],.22,.21,14))return {kind:'lid'}}

}
function releaseCapture(id){try{if(canvas.hasPointerCapture(id))canvas.releasePointerCapture(id)}catch{}}
function interrupt(){if(!drag)return;const d=drag;drag=null;if(d.kind==='raw')d.s.present=true;
 if(d.kind==='held'&&held){held.x=held.cx;held.z=held.cz}
 if(held&&(d.kind==='spatula'||d.kind==='piece')){held.x=held.cx;held.z=held.cz}

function pointerDown(e){
 e.preventDefault();if(drag||!e.isPrimary||e.button>0)return;wakeSound();assist=null;lastTouch=clock;const x=e.clientX,y=e.clientY,d=hit(x,y);

 try{canvas.setPointerCapture(e.pointerId)}catch{}

function pointerMove(e){

 const x=e.clientX,y=e.clientY,dx=x-d.sx,dy=y-d.sy;d.x=x;d.y=y;d.moved||=Math.hypot(dx,dy)>8;

 if(d.kind==='spatula'&&!held&&!d.delivered&&d.moved){d.pos=q;let g=nearestFood(q,.98);if(g)lift(g,false,q.x)}

 else if(!d.moved&&d.plate.meal&&d.plate.meal.shareable){const local=plane(e.clientX,e.clientY,dishHeight(d.plate)+.32);shareFromPlatter(d.plate,local.x-d.plate.x,local.z-d.plate.z)}
 }

}
function animate(stamp){

}
function sizeBuffer(){const r=min(2,devicePixelRatio||1)*quality;canvas.width=Math.round(W*r);canvas.height=Math.round(H*r);gl.viewport(0,0,canvas.width,canvas.height)}

gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
const listeners=[];

resize();resetDinner(true);
if(memory){({clock,contents,edges,plates,held,turnerArmed,serial,served,lastServed,splitCount,water,fog,covered,lidOpen,lidGoal,watered,opened,spots,refill,cleaning,wipePoint,cleanMarks,cleanStart,secondPlate,secondAmount,wideMoment,extraPlateSeen,order,traySlots,drops,glints,zoom}=memory);filmBrush.drawImage(memory.film,0,0);filmDirty=true;lastTouch=clock}

function pause(){interrupt();assist=null;if(frameId)cancelAnimationFrame(frameId);frameId=0;lastFrame=0;if(ac&&ac.state==='running')ac.suspend().catch(()=>{})}

 for(const stop of listeners)stop();if(ac)ac.close().catch(()=>{});startKitchen(memory)
});
}
