<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#c4cdd0">
<title>コンテナ船にコンテナをのせる</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,main{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#bfcbcd}main{position:fixed;inset:0;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%;outline:none}
#manifest,#sound{position:absolute;top:max(20px,env(safe-area-inset-top));background:#f8f7efed;border:1px solid #fff9;box-shadow:0 2px 4px #273d461c,0 6px 16px #24383e12;color:#364f52}
#manifest{left:max(20px,env(safe-area-inset-left));display:flex;gap:6px;align-items:center;height:43px;padding:0 13px;border-radius:23px;pointer-events:none}
#manifest svg{width:24px;height:24px;margin-right:3px}.divider{width:1px;height:15px;background:#bac2be;margin-right:3px}
.token{display:block;width:16px;height:12px;color:#b04a37;border-radius:2px;background:repeating-linear-gradient(90deg,transparent 0 2px,#2634392b 2px 3px),currentColor;border:1px solid #34404345;box-shadow:inset 0 1px 0 #ffffff65;position:relative}.token:nth-last-child(2){color:#477a9a}.token:last-child{color:#d69b3d}.token.loaded:after{position:absolute;content:'';height:6px;width:3px;left:5px;top:0;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
#sound{right:max(20px,env(safe-area-inset-right));height:43px;width:43px;border-radius:50%;display:grid;place-items:center;padding:10px;cursor:pointer}#sound svg{width:22px;height:22px}#sound .mute,#sound.off .waves{display:none}#sound.off .mute{display:block}
#hand{position:absolute;left:0;top:0;pointer-events:none;opacity:0;height:47px;width:40px;filter:drop-shadow(0 2px 2px #182d3d4d);transform-origin:11px 5px}
@media(max-width:500px){#manifest,#sound{top:max(14px,env(safe-area-inset-top))}#manifest{left:max(14px,env(safe-area-inset-left))}#sound{right:max(14px,env(safe-area-inset-right))}}
</style>
</head><body><main>
<canvas id="port" aria-label="港のクレーンで荷物を船にのせる"></canvas>
<div id="manifest" aria-hidden="true"><svg viewBox="0 0 30 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 15.4h12l2-2h10.5l-3.6 6.7H7z" fill="currentColor" stroke="none"/><path d="M7 14V8.7h6.2V14M8.4 8.6V5.7h3.3v2.9m4.8 2.7h4.2m1.5 0h3.5M4.2 22.4q2.8 1.6 5.4-.2 2.9 1.8 5.6 0 2.7 1.8 5.6 0 2.7 1.8 5.1.1"/></svg><i class="divider"></i><i class="token"></i><i class="token"></i><i class="token"></i></div>
<button id="sound" aria-label="音を切る" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor" stroke="none"/><path class="waves" d="M15.2 8.4a5.1 5.1 0 0 1 0 7.2m2.8-10a9 9 0 0 1 0 12.8"/><path class="mute" d="m16 9 5.5 6m0-6L16 15"/></svg></button>
<svg id="hand" aria-hidden="true" viewBox="0 0 40 47"><path d="M9 24 6 9C4.8 2.4 11 1.1 12.6 7l3.2 13.5-1.3-5.8c-.7-4.5 4.5-5.9 6-1.7l1.6 5.3-.7-3.6c-.7-4.1 4.6-5.2 5.8-1.3l1.2 4.6-.3-2.2c-.5-3.2 4.2-4.2 5.2-.8l2.5 10c1.1 5.6-1.1 9.1-2 12.3l.5 2.8-16.1 4-.8-3.4C13 38 8.5 34.1 4.4 29c-3.1-4.1.6-7.9 4.6-5z" fill="#fff8e8" stroke="#676a60" stroke-width="1.7" stroke-linejoin="round"/></svg>
</main>
<script src="vendor/three.min.js"></script><script src="physics.js"></script><script src="models.js"></script><script src="harbor.js"></script>
</body></html>
