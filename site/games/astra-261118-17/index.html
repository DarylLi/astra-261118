<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#a48b65}
canvas{width:100%;height:100%;display:block;touch-action:none}
#recipe,#sound{position:fixed;top:max(19px,env(safe-area-inset-top));background:#fff7e6ed;border:1px solid #fff7e4;box-shadow:0 3px 14px #36291935, inset 0 -2px 0 #baa38366;display:flex;align-items:center;color:#635f4c}
#recipe{left:max(21px,env(safe-area-inset-left));height:48px;padding:4px 7px;gap:5px;border-radius:19px;pointer-events:none}

svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#sound{right:max(21px,env(safe-area-inset-right));border-radius:50%;width:47px;height:47px;justify-content:center;padding:0;touch-action:manipulation}
#sound.off .waves,#sound:not(.off) .slash{display:none}
@media(max-width:550px){#recipe{left:max(13px,env(safe-area-inset-left));height:42px;gap:2px;padding:4px}#recipe i{width:30px;height:31px}#sound{width:41px;height:41px;right:max(13px,env(safe-area-inset-right))}}
